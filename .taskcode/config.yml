# Configuracion de taskctl (TaskCode 0.16)
# automatico: las preguntas se hacen en plan; el resto se encadena hasta finish.
modo_flujo: automatico

# Mientras no haya codigo (Fase 1 son decisiones), todo es documentacion y no
# hay comando de verificacion. Se declara con la primera tarea de codigo (F2-1).
rutas_documentacion: [docs/**, "*.md"]
