[package]
name = "tc2"
description = "CLI de TaskCodeTwo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "tc2"
path = "src/main.rs"

[lints]
workspace = true

# F2-5: lectura del frontmatter YAML (F1-14, fila F1-9: serde-saphyr con
# claves duplicadas como error). Solo se lee con el crate; la escritura es un
# emisor propio (forma fija de F1-9). Todo detras de `tarea::yaml`.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde-saphyr = { version = "2.1", default-features = false, features = ["deserialize"] }
# F2-6: adaptador GitHub por la API REST (F1-13 decision 1, F1-14): cliente
# HTTP bloqueante con TLS del almacen del sistema (rustls-platform-verifier
# por la feature `platform-verifier`), sin `gh`. Todo detras de
# `plataforma::http`.
serde_json = "1"
ureq = { version = "3.5", default-features = false, features = ["rustls", "platform-verifier"] }
# F2-12: tabla de targets, sha256 y SHA256SUMS compartidos con xtask
# (`tc2 version --json` y `tc2 actualizar --cli`).
distribucion = { path = "../distribucion" }
# F6-1: JWT RS256 de la GitHub App del agente (y del revisor) y la cabecera
# basica de git. Ya estaban en el arbol (ring por rustls, base64 por ureq):
# se declaran directas en la misma version de Cargo.lock, sin crates nuevos
# (alternativa descartada: `jsonwebtoken`, que trae su propia cripto).
ring = "0.17.14"
base64 = "0.23.1"
# F6-3: comparador de los globs de `patrones_archivo` de las revisoras (F1-15
# decision 3: sin distinguir mayusculas). Sin la feature `log`.
globset = { version = "0.4.21", default-features = false }

# Parser YAML de otra base de codigo (port de libyaml, como el PyYAML del PoC
# de F1-9) para la ida y vuelta de los tests: con el de produccion seria
# circular.
[dev-dependencies]
serde_yaml = "0.9"
