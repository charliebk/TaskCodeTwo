# Release de TaskCodeTwo (TASK-025, F2-10; ADR F1-14 D4a, F1-3 D3a, F1-8).
#
# - Con tag `v*` (anotado sobre el merge en main): compila los 6 targets de
#   P12 en runners nativos, prueba que arrancan sin Node, publica la release
#   con los 6 binarios, `SHA256SUMS` y attestation de procedencia (Sigstore),
#   y la vuelve a descargar desde la URL publica para comprobarla. Publica
#   tambien los instaladores de una linea (`instalar/`, TASK-026, F2-11) y
#   ejecuta la linea real en cada sistema, midiendo que tarda menos de 60 s.
# - Antes de publicar nada, `instaladores-ensayo` prueba los instaladores
#   contra los binarios del build servidos en 127.0.0.1, y
#   `actualizar-ensayo` (TASK-027, F2-12) instala ese binario y lo actualiza
#   con `tc2 actualizar --cli` a otro de la version siguiente, tambien en
#   127.0.0.1.
# - Con `workflow_dispatch`, o con un push a una rama que toque lo que entra
#   en la release (este workflow, el humo, xtask, Cargo): ensayo. Compila y
#   prueba, pero no publica. (Los filtros de rutas no se aplican a los tags.)
#
# "Firmados" es lo de D4a: hash, attestation y firma ad hoc en macOS.
# Authenticode y Developer ID llegan con winget y Homebrew.
# Cada job es de una sola clase (F1-8): ninguno compila y publica a la vez.
name: release

on:
  push:
    tags: ["v*"]
    branches: ["**"]
    paths:
      - .github/workflows/release.yml
      - .github/scripts/humo.sh
      - .github/scripts/probar-instalador.sh
      - .github/scripts/probar-actualizar.sh
      - instalar/**
      - xtask/**
      - crates/distribucion/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .cargo/**
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  preparar:
    name: preparar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      clase: ${{ steps.version.outputs.clase }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Toolchain de rust-toolchain.toml
        run: rustup toolchain install
      - name: Version y tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
          ES_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          version="$(cargo xtask version)"
          if [ "$ES_TAG" = "true" ]; then
            clase="$(cargo xtask comprobar-tag "$TAG")"
            # Una release estable sale solo de un commit de main (F1-3 D3a).
            if [ "$clase" = "estable" ]; then
              git fetch --no-tags origin main
              if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
                echo "::error::el tag estable $TAG no esta sobre main; pon el tag en el merge en main, o usa un sufijo (v<version>-<sufijo>) para una prerelease"
                exit 1
              fi
            fi
          else
            clase="ensayo"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "clase=$clase" >> "$GITHUB_OUTPUT"
          echo "version $version, release: $clase"

  build:
    name: build (${{ matrix.alias }})
    needs: preparar
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { alias: win-x64, target: x86_64-pc-windows-msvc, runner: windows-latest }
          - { alias: win-arm64, target: aarch64-pc-windows-msvc, runner: windows-11-arm }
          - { alias: darwin-x64, target: x86_64-apple-darwin, runner: macos-15-intel }
          - { alias: darwin-arm64, target: aarch64-apple-darwin, runner: macos-latest }
          - { alias: linux-x64, target: x86_64-unknown-linux-musl, runner: ubuntu-latest }
          - { alias: linux-arm64, target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain y target
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install
          rustup target add "$TARGET"
          rustc --version
      - name: musl-tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - name: cargo xtask empaquetar
        env:
          TARGET: ${{ matrix.target }}
        run: cargo xtask empaquetar --target "$TARGET" --salida dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-${{ matrix.alias }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  humo:
    name: humo (${{ matrix.alias }})
    needs: [preparar, build]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { alias: win-x64, runner: windows-latest, ext: .exe }
          - { alias: win-arm64, runner: windows-11-arm, ext: .exe }
          - { alias: darwin-x64, runner: macos-15-intel, ext: "" }
          - { alias: darwin-arm64, runner: macos-latest, ext: "" }
          - { alias: linux-x64, runner: ubuntu-latest, ext: "" }
          - { alias: linux-arm64, runner: ubuntu-24.04-arm, ext: "" }
    steps:
      # Solo el script de humo: el binario no se compila aqui.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bin-${{ matrix.alias }}
          path: dist
      - name: sha256 del artefacto
        working-directory: dist
        run: |
          if command -v sha256sum >/dev/null; then sha256sum -c ./*.sha256; else shasum -a 256 -c ./*.sha256; fi
      - name: Arranca sin Node
        env:
          FICHERO: tc2-${{ needs.preparar.outputs.version }}-${{ matrix.alias }}${{ matrix.ext }}
          VERSION: ${{ needs.preparar.outputs.version }}
        run: bash .github/scripts/humo.sh "dist/$FICHERO" "$VERSION"

  # Los instaladores contra los binarios del build, servidos en 127.0.0.1:
  # instalacion medida, hash alterado y PATH idempotente
  # (.github/scripts/probar-instalador.sh). Windows en PowerShell 5.1; Linux
  # tambien en alpine (sin curl, sin bash), con la imagen de humo.sh.
  instaladores-ensayo:
    name: instaladores-ensayo (${{ matrix.alias }}${{ matrix.alpine && ', alpine' || '' }})
    needs: [preparar, build]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { alias: win-x64, runner: windows-latest, alpine: false }
          - { alias: win-arm64, runner: windows-11-arm, alpine: false }
          - { alias: darwin-x64, runner: macos-15-intel, alpine: false }
          - { alias: darwin-arm64, runner: macos-latest, alpine: false }
          - { alias: linux-x64, runner: ubuntu-latest, alpine: false }
          - { alias: linux-arm64, runner: ubuntu-24.04-arm, alpine: false }
          - { alias: linux-x64, runner: ubuntu-latest, alpine: true }
          - { alias: linux-arm64, runner: ubuntu-24.04-arm, alpine: true }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
            instalar
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bin-${{ matrix.alias }}
          path: srv
      - name: Release de ensayo (y otra con el hash alterado)
        working-directory: srv
        run: |
          cat ./*.sha256 > SHA256SUMS
          rm ./*.sha256
          cp ../instalar/install.sh ../instalar/install.ps1 .
          mkdir malo
          cp tc2-* malo/
          awk '{ c = substr($1, 1, 1); print (c == "0" ? "1" : "0") substr($1, 2) "  " $2 }' SHA256SUMS > malo/SHA256SUMS
          ! cmp -s SHA256SUMS malo/SHA256SUMS
      - name: Instalador servido en 127.0.0.1
        env:
          VERSION: ${{ needs.preparar.outputs.version }}
          ALPINE: ${{ matrix.alpine }}
        run: |
          py=python
          command -v python >/dev/null 2>&1 || py=python3
          "$py" -m http.server 8765 --bind 127.0.0.1 --directory srv >/dev/null 2>&1 &
          for _ in $(seq 1 30); do
            curl -fsS -o /dev/null http://127.0.0.1:8765/SHA256SUMS && break
            sleep 1
          done
          if [ "$ALPINE" = "true" ]; then
            imagen="$(sed -n 's/^imagen="\(.*\)"$/\1/p' .github/scripts/humo.sh)"
            test -n "$imagen"
            docker run --rm --network host -v "$PWD:/w:ro" -w /w "$imagen" \
              sh .github/scripts/probar-instalador.sh local http://127.0.0.1:8765 "$VERSION" "$VERSION"
          else
            sh .github/scripts/probar-instalador.sh local http://127.0.0.1:8765 "$VERSION" "$VERSION"
          fi

  # `tc2 actualizar --cli` de punta a punta (TASK-027, F2-12): instala el
  # binario del build (vX) con el instalador de una linea y lo actualiza a vY,
  # el mismo codigo recompilado con la version siguiente; las dos releases (y
  # una con el hash alterado) servidas en 127.0.0.1
  # (.github/scripts/probar-actualizar.sh). vY solo existe aqui: no se sube ni
  # se publica.
  actualizar-ensayo:
    name: actualizar-ensayo (${{ matrix.alias }})
    needs: [preparar, build]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { alias: win-x64, target: x86_64-pc-windows-msvc, runner: windows-latest }
          - { alias: win-arm64, target: aarch64-pc-windows-msvc, runner: windows-11-arm }
          - { alias: darwin-x64, target: x86_64-apple-darwin, runner: macos-15-intel }
          - { alias: darwin-arm64, target: aarch64-apple-darwin, runner: macos-latest }
          - { alias: linux-x64, target: x86_64-unknown-linux-musl, runner: ubuntu-latest }
          - { alias: linux-arm64, target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain y target
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install
          rustup target add "$TARGET"
      - name: musl-tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bin-${{ matrix.alias }}
          path: vx
      - name: vY, el mismo codigo con la version siguiente
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.preparar.outputs.version }}
        run: |
          base="${VERSION%%-*}"
          vy="$(echo "$base" | awk -F. '{ print $1 "." $2 "." $3 + 1 }')"
          sed -i.orig "s/^version = \"$VERSION\"$/version = \"$vy\"/" Cargo.toml
          ! cmp -s Cargo.toml Cargo.toml.orig || { echo "::error::el sed no cambio la version de Cargo.toml ($VERSION -> $vy)"; exit 1; }
          rm Cargo.toml.orig
          # Solo cambian las entradas de los miembros del workspace.
          cargo update --workspace
          cargo xtask empaquetar --target "$TARGET" --salida vy
          echo "VY=$vy" >> "$GITHUB_ENV"
      - name: Instalar vX y actualizar a vY en 127.0.0.1
        env:
          VERSION: ${{ needs.preparar.outputs.version }}
        run: sh .github/scripts/probar-actualizar.sh vx "$VERSION" vy "$VY"

  publicar:
    name: publicar
    needs: [preparar, build, humo, instaladores-ensayo, actualizar-ensayo]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain de rust-toolchain.toml
        run: rustup toolchain install
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bin-*
          path: dist
          merge-multiple: true
      - name: SHA256SUMS
        run: |
          cargo xtask sumas dist
          # Las sumas de la release tienen que ser las mismas que dejo cada build.
          # Orden por bytes, el mismo que usa xtask.
          diff <(cat dist/*.sha256 | LC_ALL=C sort -k 2) dist/SHA256SUMS
          rm dist/*.sha256
          test "$(ls dist/tc2-* | wc -l)" -eq 6
          # Los instaladores van en la release y en la attestation, pero no en
          # SHA256SUMS: es el contrato de los 6 binarios (cli.lock, F2-12).
          cp instalar/install.sh instalar/install.ps1 dist/
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/tc2-*
            dist/install.sh
            dist/install.ps1
      - name: Crear la release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          CLASE: ${{ needs.preparar.outputs.clase }}
        # Primero como borrador y despues se publica: si el job se corta a
        # medias no queda una release publica incompleta, solo un borrador
        # (docs/distribucion/releases.md dice como recuperarse).
        run: |
          extra=()
          if [ "$CLASE" = "prerelease" ]; then extra+=(--prerelease); fi
          gh release create "$TAG" dist/tc2-* dist/SHA256SUMS dist/install.sh dist/install.ps1 --draft \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" "${extra[@]}" \
            --notes "Binarios de tc2 para los 6 sistemas de P12, con SHA256SUMS, attestation de procedencia e instaladores de una linea. Instalacion: docs/distribucion/instalar.md. Verificacion: docs/distribucion/releases.md"
          test "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')" -eq 9
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false

  verificar-release:
    name: verificar-release (${{ matrix.alias }})
    needs: [preparar, publicar]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
      attestations: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { alias: win-x64, runner: windows-latest, ext: .exe }
          - { alias: win-arm64, runner: windows-11-arm, ext: .exe }
          - { alias: darwin-x64, runner: macos-15-intel, ext: "" }
          - { alias: darwin-arm64, runner: macos-latest, ext: "" }
          - { alias: linux-x64, runner: ubuntu-latest, ext: "" }
          - { alias: linux-arm64, runner: ubuntu-24.04-arm, ext: "" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Descarga anonima desde la URL publica
        env:
          BASE: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}
          FICHERO: tc2-${{ needs.preparar.outputs.version }}-${{ matrix.alias }}${{ matrix.ext }}
        run: |
          mkdir -p pub && cd pub
          curl -fsSL --retry 3 -o SHA256SUMS "$BASE/SHA256SUMS"
          curl -fsSL --retry 3 -o "$FICHERO" "$BASE/$FICHERO"
          grep -F "  $FICHERO" SHA256SUMS > una.sha256
          test "$(wc -l < una.sha256)" -eq 1
          if command -v sha256sum >/dev/null; then sha256sum -c una.sha256; else shasum -a 256 -c una.sha256; fi
      - name: gh attestation verify
        env:
          GH_TOKEN: ${{ github.token }}
          FICHERO: tc2-${{ needs.preparar.outputs.version }}-${{ matrix.alias }}${{ matrix.ext }}
        run: |
          gh attestation verify "pub/$FICHERO" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
      - name: Arranca sin Node
        env:
          FICHERO: tc2-${{ needs.preparar.outputs.version }}-${{ matrix.alias }}${{ matrix.ext }}
          VERSION: ${{ needs.preparar.outputs.version }}
        run: bash .github/scripts/humo.sh "pub/$FICHERO" "$VERSION"

  # La linea real contra la release publicada, en cada sistema: mide que la
  # instalacion tarda menos de 60 s hasta que una terminal nueva encuentra tc2
  # (criterio 1 de TASK-026). Con gh y token, comprueba tambien la
  # attestation; en alpine no hay gh y se comprueba el aviso.
  verificar-instaladores:
    name: verificar-instaladores (${{ matrix.alias }}${{ matrix.alpine && ', alpine' || '' }})
    needs: [preparar, publicar]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
      attestations: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { alias: win-x64, runner: windows-latest, alpine: false }
          - { alias: win-arm64, runner: windows-11-arm, alpine: false }
          - { alias: darwin-x64, runner: macos-15-intel, alpine: false }
          - { alias: darwin-arm64, runner: macos-latest, alpine: false }
          - { alias: linux-x64, runner: ubuntu-latest, alpine: false }
          - { alias: linux-arm64, runner: ubuntu-24.04-arm, alpine: false }
          - { alias: linux-x64, runner: ubuntu-latest, alpine: true }
          - { alias: linux-arm64, runner: ubuntu-24.04-arm, alpine: true }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: La linea de instalacion real
        env:
          GH_TOKEN: ${{ github.token }}
          URL: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.preparar.outputs.version }}
          ALPINE: ${{ matrix.alpine }}
        run: |
          if [ "$ALPINE" = "true" ]; then
            imagen="$(sed -n 's/^imagen="\(.*\)"$/\1/p' .github/scripts/humo.sh)"
            test -n "$imagen"
            docker run --rm -v "$PWD:/w:ro" -w /w "$imagen" \
              sh .github/scripts/probar-instalador.sh publico "$URL" "${TAG#v}" "$VERSION"
          else
            sh .github/scripts/probar-instalador.sh publico "$URL" "${TAG#v}" "$VERSION"
          fi
