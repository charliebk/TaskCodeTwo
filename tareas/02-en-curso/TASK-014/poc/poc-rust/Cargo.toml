[package]
name = "tablero"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
serde-saphyr = "2.1"
serde = { version = "1", features = ["derive"] }
ureq = { version = "3.5", default-features = false, features = ["rustls", "platform-verifier"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
